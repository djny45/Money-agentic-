<text x="600" y="590" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" fill="#fff">Money-<tspan fill="#ff9f1c">Agentic-</tspan></text>
<text x="600" y="635" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="9" fill="#ddd">AI AGENTS FOR REAL INCOME</text>
