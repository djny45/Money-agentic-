<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Money-Agentic logo</title><desc id="desc">Futuristic AI agent robot with an orange orbital ring and growth arrow.</desc>
