services:
  money-agentic:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./creatives:/app/creatives
    restart: unless-stopped
    depends_on:
      - ollama
      - comfyui

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  comfyui:
    image: comfyanonymous/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - comfyui:/comfyui
    restart: unless-stopped

volumes:
  ollama:
  comfyui:
