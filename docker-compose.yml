services:
  money-agentic:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./creatives:/app/creatives
    restart: unless-stopped
    command: ["uvicorn", "app.api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - comfyui

  comfyui:
    image: comfyanonymous/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - comfyui_data:/comfyui
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    environment:
      PYTHON_API_URL: http://money-agentic:8000
      MODE: DRY_RUN
      AUTO_PUBLISH: "false"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - money-agentic
    restart: unless-stopped

volumes:
  comfyui_data:
