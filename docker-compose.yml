services:
  money-agentic:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./creatives:/app/creatives
    restart: unless-stopped
    depends_on:
      - comfyui

  comfyui:
    image: comfyanonymous/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - comfyui_data:/comfyui
    restart: unless-stopped

volumes:
  comfyui_data:
