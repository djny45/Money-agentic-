services:
  money-agentic:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./creatives:/app/creatives
    restart: unless-stopped
    command: ["uvicorn", "app.api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - comfyui

  comfyui:
    image: comfyanonymous/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - comfyui_data:/comfyui
    restart: unless-stopped

volumes:
  comfyui_data:
