[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-agentic"
version = "0.1.0"
description = "Autonomous, compliant CPA promotion and optimization agent"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "aiosqlite>=0.20,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1"
]
[project.scripts]
money-agentic = "app.cli:main"
